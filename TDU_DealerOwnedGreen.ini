; TDU_DealerOwnedGreen - shows vehicles you already own in green at car and bike dealers
; Place next to TDU_DealerOwnedGreen.asi in the game's "scripts" folder.

[DealerOwnedGreen]
; 1 = on, 0 = off (game behaves exactly as unpatched)
Enabled=1

; Name colour for owned vehicles, hex RRGGBB (game uses FF0000 = out of stock, 00B5E1 = reserved)
Color=33DD33

; 1 = write TDU_DealerOwnedGreen.log next to this file (hook status + each dealer selection)
Log=1
